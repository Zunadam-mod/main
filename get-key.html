
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071426">
  <title>ZUNADAM KEY SYSTEM</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(ellipse at top, #123d69 0%, transparent 55%),
        linear-gradient(135deg, #050b16, #0b1930);
    }

    .container {
      width: 100%;
      max-width: 430px;
      padding: 32px 24px;
      text-align: center;
      background: rgba(13, 29, 52, 0.95);
      border: 1px solid rgba(0, 170, 255, 0.45);
      border-radius: 22px;
      box-shadow: 0 0 35px rgba(0, 145, 255, 0.15);
    }

    .logo {
      width: 75px;
      height: 75px;
      margin: 0 auto 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 36px;
      border-radius: 50%;
      color: #38bdf8;
      background: #102b49;
      border: 1px solid #168de2;
    }

    h1 {
      font-size: 27px;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 12px;
      color: #8ebce7;
      letter-spacing: 2px;
      margin-bottom: 30px;
    }

    .key-box {
      padding: 20px 12px;
      margin-bottom: 20px;
      background: #071426;
      border: 1px solid #203c5d;
      border-radius: 12px;
      overflow-wrap: anywhere;
    }

    .key-label {
      color: #8ba9c9;
      font-size: 12px;
      margin-bottom: 14px;
    }

    #key {
      color: #45d4ff;
      font-size: 19px;
      font-weight: bold;
      letter-spacing: 1px;
      line-height: 1.6;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .generate {
      color: white;
      background: linear-gradient(90deg, #0878e8, #00b8ff);
      box-shadow: 0 4px 18px rgba(0, 160, 255, 0.2);
    }

    .copy {
      color: #38bdf8;
      background: #102b49;
      border: 1px solid #17649a;
    }

    button:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }

    button:active {
      transform: scale(0.98);
    }

    #message {
      min-height: 18px;
      margin-top: 14px;
      color: #6ee7b7;
      font-size: 12px;
    }

    .footer {
      margin-top: 25px;
      color: #607d9e;
      font-size: 11px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">🔑</div>

    <h1>ZUNADAM</h1>
    <p class="subtitle">KEY GENERATOR SYSTEM</p>

    <section class="key-box">
      <p class="key-label">YOUR ACCESS KEY</p>
      <div id="key">Ấn GET KEY để tạo mã</div>
    </section>

    <button class="generate" id="generateBtn" onclick="generateKey()">
      ⚡ GET KEY
    </button>

    <button class="copy" onclick="copyKey()">
      📋 COPY KEY
    </button>

    <p id="message" role="status" aria-live="polite"></p>

    <div class="footer">
      ZUNADAM MOD © 2026
    </div>
  </main>

  <script>
    let currentKey = "";

    function generateKey() {
      const characters = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

      function randomGroup() {
        let result = "";

        for (let i = 0; i < 4; i++) {
          const index = Math.floor(
            Math.random() * characters.length
          );
          result += characters[index];
        }

        return result;
      }

      currentKey =
        "ZUNA-" +
        randomGroup() + "-" +
        randomGroup() + "-" +
        randomGroup();

      document.getElementById("key").textContent = currentKey;
      document.getElementById("message").textContent =
        "Tạo Key thành công!";

      document.getElementById("generateBtn").textContent =
        "⚡ GENERATE NEW KEY";
    }

    async function copyKey() {
      const message = document.getElementById("message");

      if (!currentKey) {
        message.textContent = "Hãy nhấn GET KEY trước!";
        return;
      }

      try {
        await navigator.clipboard.writeText(currentKey);
        message.textContent = "Đã sao chép Key thành công!";
      } catch (error) {
        const input = document.createElement("textarea");
        input.value = currentKey;
        input.style.position = "fixed";
        input.style.opacity = "0";
        document.body.appendChild(input);
        input.select();

        const copied = document.execCommand("copy");
        input.remove();

        message.textContent = copied
          ? "Đã sao chép Key thành công!"
          : "Không sao chép được. Hãy chọn và sao chép Key thủ công.";
      }
    }
  </script>
</body>
</html>
