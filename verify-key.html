<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ZUNADAM - Verify Key</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {

    min-height: 100vh;

    font-family: Arial, sans-serif;

    color: white;

    background:
        radial-gradient(
            circle at top,
            #172554,
            #020617 65%
        );

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;
}

.box {

    width: 100%;

    max-width: 430px;

    background:
        rgba(15,23,42,.95);

    border:
        1px solid
        rgba(96,165,250,.35);

    border-radius: 25px;

    padding: 30px;

    text-align: center;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.5);
}

.avatar {

    width: 90px;

    height: 90px;

    border-radius: 50%;

    object-fit: cover;

    border: 3px solid #60a5fa;

    margin-bottom: 18px;
}

h1 {

    font-size: 28px;

    margin-bottom: 8px;
}

.desc {

    color: #94a3b8;

    margin-bottom: 25px;
}

input {

    width: 100%;

    padding: 16px;

    border-radius: 13px;

    border:
        1px solid #334155;

    background: #020617;

    color: white;

    outline: none;

    text-align: center;

    font-size: 15px;

    margin-bottom: 12px;

    text-transform: uppercase;
}

input:focus {

    border-color: #60a5fa;
}

button {

    width: 100%;

    padding: 15px;

    border: none;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #06b6d4
        );

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}

button:disabled {

    opacity: .6;

    cursor: wait;
}

.message {

    margin-top: 18px;

    color: #fbbf24;

    min-height: 22px;
}

.success {

    display: none;

    margin-top: 18px;

    padding: 16px;

    border-radius: 13px;

    background:
        rgba(22,101,52,.25);

    border:
        1px solid
        rgba(74,222,128,.3);
}

.download {

    display: block;

    margin-top: 12px;

    padding: 14px;

    border-radius: 12px;

    background: #16a34a;

    color: white;

    text-decoration: none;

    font-weight: bold;
}

.back {

    margin-top: 12px;

    background: #334155;
}

</style>

</head>

<body>

<div class="box">

    <img
        src="avatar.png"
        class="avatar"
        alt="ZUNADAM"
    >

    <h1>ZUNADAM</h1>

    <div class="desc">
        VERIFY KEY
    </div>

    <input
        id="keyInput"
        type="text"
        placeholder="ZUNA-XXXXX-XXXXX-XXXXX"
        autocomplete="off"
    >

    <button id="verifyButton">
        🔐 VERIFY KEY
    </button>

    <div
        class="message"
        id="message"
    ></div>

    <div
        class="success"
        id="success"
    >

        <b>✅ KEY HỢP LỆ</b>

        <a
            id="download"
            class="download"
            href="#"
        >
            ⬇️ TIẾP TỤC
        </a>

    </div>

    <button
        class="back"
        onclick="location.href='get-key.html'"
    >
        ← QUAY LẠI
    </button>

</div>


<script>

/*
=================================
THAY URL NÀY
=================================
*/

const API =
    "YOUR-WORKER-URL";


const input =
    document.getElementById(
        "keyInput"
    );

const verifyButton =
    document.getElementById(
        "verifyButton"
    );

const message =
    document.getElementById(
        "message"
    );

const success =
    document.getElementById(
        "success"
    );

const download =
    document.getElementById(
        "download"
    );


verifyButton.onclick =
    async function() {

    const key =
        input.value
            .trim()
            .toUpperCase();

    if (!key) {

        message.textContent =
            "❌ Vui lòng nhập key.";

        return;
    }

    verifyButton.disabled = true;

    verifyButton.textContent =
        "⏳ ĐANG KIỂM TRA...";

    message.textContent = "";

    success.style.display =
        "none";

    try {

        const result =
            await fetch(
                API +
                "/api/verify-key",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            key: key
                        })
                }
            );

        const data =
            await result.json();

        if (!data.valid) {

            message.textContent =
                "❌ " +
                data.message;

            return;
        }

        success.style.display =
            "block";

        download.href =
            data.redirect;

        verifyButton.textContent =
            "✅ KEY HỢP LỆ";

    } catch(error) {

        message.textContent =
            "❌ Không kết nối được máy chủ.";

    } finally {

        verifyButton.disabled = false;
    }
};


input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            verifyButton.click();

        }

    }
);

</script>

</body>

</html>
